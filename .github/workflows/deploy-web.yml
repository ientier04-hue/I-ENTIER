name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pharmacy/package-lock.json

      - name: Build independent pharmacy
        working-directory: pharmacy
        env:
          PHARMACY_BASE_PATH: /I-ENTIER/pharmacy
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build:web

      - name: Build the Web app
        run: flutter build web --release --base-href /I-ENTIER/ --dart-define=PHARMACY_WEB_URL=https://ientier04-hue.github.io/I-ENTIER/pharmacy/

      - name: Include pharmacy web app
        run: cp -R pharmacy/dist build/web/pharmacy

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
